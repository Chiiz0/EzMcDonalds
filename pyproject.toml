[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ezmcdonalds"
version = "0.1.0a21"
description = "Local-first McDonald's China pickup ordering for personal agents"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Chiiz0"}]
dependencies = ["blake3==1.0.11", "mcp==2.3.0", "pydantic>=2.12,<3", "cryptography>=46,<51"]

[project.optional-dependencies]
sampling = ["mitmproxy==12.3.1; python_version >= '3.12'"]

[project.urls]
Repository = "https://github.com/Chiiz0/EzMcDonalds"
Issues = "https://github.com/Chiiz0/EzMcDonalds/issues"

[project.scripts]
ezmcd = "ezmcd.cli:main"
ezmcd-mcp = "ezmcd.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ezmcd = ["py.typed"]
